name: Application CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  REGION: asia-south1
  GAR_REPO: banking

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  images:
    name: Docker build (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - dir: identity-service
            pkg: "@banking/identity-service"
          - dir: account-service
            pkg: "@banking/account-service"
          - dir: ledger-service
            pkg: "@banking/ledger-service"
          - dir: transfer-service
            pkg: "@banking/transfer-service"
          - dir: payment-service
            pkg: "@banking/payment-service"
          - dir: card-service
            pkg: "@banking/card-service"
          - dir: bff-api-service
            pkg: "@banking/bff-api-service"
          - dir: customer-web
            pkg: "@banking/customer-web"
            dockerfile: docker/customer-web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          if [ "${{ matrix.dir }}" = "customer-web" ]; then
            docker build \
              -f docker/customer-web.Dockerfile \
              -t banking/customer-web:${{ github.sha }} \
              .
          else
            docker build \
              -f docker/service.Dockerfile \
              --build-arg SERVICE_DIR=${{ matrix.dir }} \
              --build-arg SERVICE_FILTER=${{ matrix.pkg }} \
              -t banking/${{ matrix.dir }}:${{ github.sha }} \
              .
          fi

  publish:
    name: Push images to Artifact Registry
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    timeout-minutes: 45
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push core services
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          PROJECT_ID="${PROJECT_ID:-ai-rag-agent-project}"
          PREFIX="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.GAR_REPO }}"
          TAG="${GITHUB_SHA}"
          for pair in \
            "identity-service @banking/identity-service" \
            "account-service @banking/account-service" \
            "ledger-service @banking/ledger-service" \
            "transfer-service @banking/transfer-service" \
            "payment-service @banking/payment-service" \
            "card-service @banking/card-service" \
            "bff-api-service @banking/bff-api-service"
          do
            set -- $pair
            DIR="$1"
            PKG="$2"
            IMAGE="${PREFIX}/${DIR}:${TAG}"
            docker build \
              -f docker/service.Dockerfile \
              --build-arg SERVICE_DIR="${DIR}" \
              --build-arg SERVICE_FILTER="${PKG}" \
              -t "${IMAGE}" \
              -t "${PREFIX}/${DIR}:develop-latest" \
              .
            docker push "${IMAGE}"
            docker push "${PREFIX}/${DIR}:develop-latest"
          done
          WEB_IMAGE="${PREFIX}/customer-web:${TAG}"
          docker build -f docker/customer-web.Dockerfile \
            -t "${WEB_IMAGE}" \
            -t "${PREFIX}/customer-web:develop-latest" \
            .
          docker push "${WEB_IMAGE}"
          docker push "${PREFIX}/customer-web:develop-latest"
